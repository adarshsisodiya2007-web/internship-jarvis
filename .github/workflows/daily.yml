name: Internship JARVIS Daily Run

on:
  # Manual trigger from GitHub Actions UI (Test your setup with 1 click)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run in Dry-Run mode without sending email'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

  # SCHEDULED TRIGGER (9:00 PM Indian Standard Time / 15:30 UTC)
  schedule:
    - cron: '30 15 * * *'

permissions:
  contents: write

jobs:
  run-internship-jarvis:
    name: Find & Email Matching Internships
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Internship JARVIS Pipeline
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS || secrets.GMAIL_USER }}
          GMAIL_USER: ${{ secrets.GMAIL_ADDRESS || secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL || secrets.GMAIL_ADDRESS || secrets.GMAIL_USER }}
          DASHBOARD_URL: 'https://internship-jarvis.onrender.com/'
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          MIN_MATCH_SCORE: '40'
        run: |
          python -m src.main

      - name: Commit and push latest matches snapshot for Web Dashboard
        if: success()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/latest_matches.json
          git diff --staged --quiet || (git commit -m "chore(data): update latest matches snapshot [skip ci]" && git push origin main)

      - name: Upload HTML Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-internship-report
          path: reports/latest_report.html
          retention-days: 7
